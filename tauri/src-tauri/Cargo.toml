[package]
name = "tomato-timer"
version = "0.2.1"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rodio = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
