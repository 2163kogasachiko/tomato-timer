<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title></title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  }
  .card {
    width: 350px;
    height: 92px;
    border-radius: 18px;
    background: rgba(246, 246, 246, 0.97);
    position: relative;
  }
  @media (prefers-color-scheme: dark) {
    .card { background: rgba(45, 45, 45, 0.97); }
    .title { color: #eee; }
    .message { color: #bbb; }
  }
  .icon {
    position: absolute;
    left: 14px;
    top: 15px;
    width: 62px;
    height: 62px;
    object-fit: contain;
  }
  .title {
    position: absolute;
    left: 85px;
    top: 16px;
    width: 250px;
    font-size: 16px;
    font-weight: bold;
    color: #222;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .message {
    position: absolute;
    left: 85px;
    top: 48px;
    width: 250px;
    font-size: 14px;
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="tomato.png" onerror="this.onerror=null;this.src='tomato-placeholder.png'" alt="">
    <div class="title" id="title"></div>
    <div class="message" id="message"></div>
  </div>
<script>
const { invoke } = window.__TAURI__.core;
invoke("get_notification").then(n => {
  if (!n) return;
  document.getElementById("title").textContent = n.title;
  document.getElementById("message").textContent = n.message;
});
</script>
</body>
</html>
