name: Build Tauri app

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths: [tauri/**, .github/workflows/tauri-build.yml]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $ver"
            exit 1
          fi
        shell: bash

      - name: Install frontend deps
        run: npm install

      - name: Prepare placeholder tomato image
        run: bash scripts/prepare-tomato.sh
        shell: bash

      - name: Build (NSIS installer)
        run: npm run build -- --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tomato-timer-windows-nsis
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: tomato-timer-windows-exe
          path: tauri/src-tauri/target/release/tomato-timer.exe

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $ver"
            exit 1
          fi
        shell: bash

      - name: Install frontend deps
        run: npm install

      - name: Prepare placeholder tomato image
        run: bash scripts/prepare-tomato.sh
        shell: bash

      - name: Build (dmg)
        run: npm run build -- --bundles dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: tomato-timer-macos-dmg
          path: tauri/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
            else
              git log --no-merges --pretty='- %s' "${TAG}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/tomato-timer-windows-exe/tomato-timer.exe "release/TomatoTimer-Windows-${GITHUB_REF_NAME}.exe"
          cp artifacts/tomato-timer-windows-nsis/*.exe release/
          cp artifacts/tomato-timer-macos-dmg/*.dmg release/
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TomatoTimer ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
