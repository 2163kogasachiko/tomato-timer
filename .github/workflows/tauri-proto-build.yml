name: Build Tauri prototype (Windows)

on:
  push:
    branches: [feat/tauri-proto]
    paths: [tauri/**, .github/workflows/tauri-proto-build.yml]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm install

      - name: Build (NSIS installer)
        run: npm run build -- --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tomato-timer-tauri-windows-nsis
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: tomato-timer-tauri-windows-exe
          path: tauri/src-tauri/target/release/tomato-timer-tauri-proto.exe
